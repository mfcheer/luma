plugins { id 'com.android.application' }
android {
 namespace 'com.jianping.tv'
 compileSdk 35
 defaultConfig { applicationId 'com.jianping.tv'; minSdk 23; targetSdk 35; versionCode 28; versionName '0.9.10' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 lint { abortOnError true }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
 }
}
dependencies { implementation 'me.majiajie:tinypinyin:2.0.3'
 testImplementation 'org.json:json:20240303'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1' }

tasks.register('copyTestDeps', Copy) { from configurations.debugUnitTestRuntimeClasspath; into layout.buildDirectory.dir('test-libs') }
